<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Копилка — трекер денег</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Manrope:wght@400;600;700&display=swap">
<style>
:root{--bg:#0a1228;--s1:#111c3a;--s2:#1a2850;--ink:#eaf4ff;--mute:#8fa8cf;--line:#26386b;--in:#6ee7c8;--out:#ff7a9a;--gold:#ffd166;--vio:#9b8cff;--sky:#6cc3ff;
--fd:"Unbounded","Trebuchet MS",sans-serif;--fb:"Manrope","Segoe UI",Roboto,sans-serif;
color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#120f2a}}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:radial-gradient(900px 500px at 85% -10%,#2f6bc455,transparent 60%),var(--bg);background-attachment:fixed;color:var(--ink);font:15px/1.45 var(--fb);min-height:100vh}
main{max-width:560px;margin:0 auto;padding:22px 16px 110px}
.hero{padding:8px 0 22px}
.hero small{color:var(--mute);font-size:14px}
.bal{font:700 clamp(36px,11vw,58px)/1.05 var(--fd);letter-spacing:-.03em;margin:6px 0 18px;font-variant-numeric:tabular-nums;word-break:break-word;background:linear-gradient(100deg,#fff 25%,#8fd3ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.bal.neg{background:none;color:var(--out)}
.split{display:flex;gap:10px}
.split div{flex:1;background:#111c3acc;backdrop-filter:blur(10px);box-shadow:inset 0 1px 0 #ffffff1c;border:1px solid var(--line);border-radius:18px;padding:12px 14px}
.split small{display:block;color:var(--mute)}
.split b{font:500 17px var(--fd);font-variant-numeric:tabular-nums}
.split .i b{color:var(--in)}.split .o b{color:var(--out)}
h2{font:500 18px var(--fd);margin:0 0 12px;letter-spacing:-.02em}
.panel{display:none}.panel.on{display:block}
form,.card{background:#111c3acc;backdrop-filter:blur(10px);box-shadow:inset 0 1px 0 #ffffff1c;border:1px solid var(--line);border-radius:22px;padding:14px;margin-bottom:18px}
form{display:grid;grid-template-columns:1fr 1fr;gap:8px}
form .w{grid-column:1/3}
input,select,button{font:inherit;color:var(--ink);background:var(--s2);border:1px solid var(--line);border-radius:14px;padding:12px 13px;min-width:0;width:100%}
input::placeholder{color:var(--mute)}
:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
.btn{cursor:pointer;font-weight:700;border:0;color:#16123a;position:relative;overflow:hidden;transition:transform .18s,filter .2s,box-shadow .25s}
.btn.in{background:var(--in)}.btn.out{background:var(--out)}.btn.gold{background:var(--gold)}
.day{color:var(--mute);font-size:13px;margin:16px 4px 6px}
.op{display:flex;align-items:center;gap:12px;padding:10px 4px}
.ic{flex:none;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font:700 15px var(--fd);background:var(--s2)}
.op.in .ic{color:var(--in)}.op.out .ic{color:var(--out)}
.op .t{flex:1;min-width:0}
.op .t b{display:block;font-weight:600}
.op .t span{display:block;color:var(--mute);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.op .a{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.op.in .a{color:var(--in)}
.x{width:32px;height:32px;padding:0;border:0;background:none;color:var(--mute);cursor:pointer;font-size:20px;border-radius:50%}
.empty{color:var(--mute);padding:26px 4px;text-align:center}
.total{color:var(--mute);margin:0 4px 10px}
.total b{color:var(--ink)}
.bar{display:flex;height:16px;border-radius:99px;overflow:hidden;background:var(--s2);margin:12px 0}
.bar i{display:block;height:100%}
.left{font:700 30px var(--fd);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.left.neg{color:var(--out)}
.row{display:flex;gap:8px;margin-bottom:8px}
.row input:first-child{flex:1.4}
.pi{display:flex;align-items:center;gap:10px;padding:9px 2px}
.pi em{width:10px;height:10px;border-radius:50%;flex:none}
.pi span{flex:1;min-width:0}
.pi b{font-variant-numeric:tabular-nums}
nav{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;gap:4px;justify-content:center;padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));background:#0a1228ee;backdrop-filter:blur(12px);border-top:1px solid var(--line)}
nav button{flex:1;max-width:130px;border:0;background:none;color:var(--mute);font-weight:700;font-size:13px;padding:10px 4px;border-radius:14px;cursor:pointer}
nav button.on{background:var(--s2);color:var(--ink)}
.btn.in{box-shadow:0 10px 26px -10px var(--in)}.btn.out{box-shadow:0 10px 26px -10px var(--out)}.btn.gold{box-shadow:0 10px 26px -10px var(--gold)}
.btn:hover{transform:translateY(-2px);filter:brightness(1.1)}
.btn:active{transform:scale(.95)}
nav button{position:relative;overflow:hidden;transition:background .2s,color .2s,transform .15s}
nav button:hover{color:var(--ink);background:var(--s1)}
nav button.on:hover{background:var(--s2)}
nav button:active{transform:scale(.92)}
.x{transition:background .2s,color .2s,transform .15s}
.x:hover{background:var(--s2);color:var(--out)}
.x:active{transform:scale(.8)}
.op{border-radius:14px;transition:background .2s}
.op:hover{background:var(--s1)}
.split div{transition:border-color .2s,transform .2s}
.split div:hover{border-color:var(--vio);transform:translateY(-2px)}
input,select{transition:border-color .2s,box-shadow .2s}
input:focus,select:focus{border-color:var(--vio);box-shadow:0 0 0 3px #9b8cff33}
select{cursor:pointer}
.rip{position:absolute;border-radius:50%;background:#ffffff66;pointer-events:none}
.pt{position:fixed;width:8px;height:8px;margin:-4px;border-radius:50%;pointer-events:none;z-index:20}
#snow{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:2}
body{--sky1:#070d22;--sky2:#12275a;--sky3:#24437f;--h1:#1a2f66;--h2:#132352;--h3:#0d1a3f;--tm:#0a1636;--t:#060e26;--stars:.9;--orb:.95;--o1:#fff;--o2:#b9cdf0;--og:#bcd6ff44;--aur:.35;--hl:1}
body.bg-aurora{--sky1:#050f1c;--sky2:#07202e;--sky3:#0d3a45;--h1:#0f3a4a;--h2:#0b2c3a;--h3:#08202b;--tm:#06202c;--t:#041219;--stars:.8;--orb:0;--aur:1}
body.bg-storm{--sky1:#151c2c;--sky2:#26324a;--sky3:#3b4a66;--h1:#34425e;--h2:#2a364f;--h3:#202a3f;--tm:#1a2338;--t:#111827;--stars:0;--orb:0;--aur:0}
body.bg-dusk{--sky1:#1b1141;--sky2:#5a2d6e;--sky3:#e0805f;--h1:#50285f;--h2:#34194a;--h3:#22103a;--tm:#1b0c30;--t:#120720;--stars:.5;--orb:1;--o1:#fff3c4;--o2:#ffb066;--og:#ff9a5a66;--aur:0}
body.bg-night{--sky1:#070a16;--sky2:#0a0e1f;--sky3:#0c1226;--h1:#0f1630;--h2:#0c1226;--h3:#0a0f20;--tm:#080d1c;--t:#060914;--stars:.7;--orb:0;--aur:0;--hl:.9}
#scene{position:fixed;inset:0;z-index:-1;overflow:hidden;background:linear-gradient(var(--sky1),var(--sky2) 65%,var(--sky3))}
#scene>*{position:absolute;transition:opacity .6s}
.stars{inset:0 0 35% 0;opacity:var(--stars);background-image:radial-gradient(1.5px 1.5px at 8% 14%,#fff,transparent),radial-gradient(1px 1px at 19% 32%,#fffc,transparent),radial-gradient(1.5px 1.5px at 31% 9%,#fff,transparent),radial-gradient(1px 1px at 42% 26%,#fffc,transparent),radial-gradient(1.5px 1.5px at 55% 15%,#fff,transparent),radial-gradient(1px 1px at 63% 38%,#fffc,transparent),radial-gradient(1.5px 1.5px at 72% 7%,#fff,transparent),radial-gradient(1px 1px at 81% 28%,#fffc,transparent),radial-gradient(1.5px 1.5px at 90% 18%,#fff,transparent),radial-gradient(1px 1px at 26% 50%,#fff9,transparent),radial-gradient(1px 1px at 68% 52%,#fff9,transparent),radial-gradient(1px 1px at 48% 44%,#fff9,transparent)}
.moon{top:8%;right:11%;width:62px;height:62px;border-radius:50%;opacity:var(--orb);background:radial-gradient(circle at 35% 35%,var(--o1),var(--o2));box-shadow:0 0 70px 20px var(--og)}
.aur{inset:-20%;opacity:var(--aur);background:radial-gradient(600px 300px at 20% 14%,#4dffc455,transparent 65%),radial-gradient(700px 320px at 75% 20%,#9b8cff55,transparent 65%),radial-gradient(500px 260px at 50% 8%,#6cc3ff44,transparent 65%)}
.hills{left:0;bottom:0;width:100%;height:46vh;opacity:var(--hl)}
.f1{fill:var(--h1)}.f2{fill:var(--h2)}.f3{fill:var(--h3);stroke:#a9c9f5;stroke-opacity:.3;stroke-width:1.5}.tm{fill:var(--tm)}.tf{fill:var(--t)}
button.chip{width:auto;cursor:pointer;font-family:inherit;transition:background .2s,transform .15s}
button.chip:hover{background:#bfe6ff33}
button.chip:active{transform:scale(.94)}
.bgs{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:12px 0 2px}
.bgs[hidden]{display:none}
.tile{display:flex;flex-direction:column;gap:6px;padding:6px;font-size:12px;font-weight:600;color:var(--ink);cursor:pointer;background:#111c3acc;transition:transform .15s,border-color .2s}
.tile:hover{transform:translateY(-2px)}
.tile:active{transform:scale(.94)}
.tile.on{border-color:var(--gold)}
.sw{display:block;height:44px;border-radius:10px}
.hb{display:flex;gap:8px}
.ain{width:130px;flex:none;text-align:right;padding:8px 10px;font-variant-numeric:tabular-nums}
.conv{color:var(--mute);font-size:13px}
.conv:empty{display:none}
.sub{display:block;color:var(--mute);font-size:13px}
.cs{color:var(--mute);font-weight:600}
.rt{flex:1;display:flex;align-items:center;gap:8px;font-weight:700}
#wxs{grid-template-columns:repeat(6,1fr);gap:6px}
#wxs .tile{font-size:11px;padding:5px 3px}
#scene{transition:filter .6s}
body[data-wx="rain"] #scene{filter:saturate(.6) brightness(.78)}
body[data-wx="thunder"] #scene{filter:saturate(.6) brightness(.55)}
body[data-wx="fog"] #scene{filter:saturate(.5) brightness(.9)}
#bolt{position:fixed;inset:0;pointer-events:none;z-index:3;opacity:0;background:radial-gradient(60% 50% at 70% 0%,#e8f1ffcc,#9bb8ff33 60%,transparent)}
#bolt.on{animation:bolt .8s}
@keyframes bolt{0%{opacity:0}8%{opacity:.9}18%{opacity:.1}28%{opacity:.7}100%{opacity:0}}
.hh{display:flex;align-items:center;justify-content:space-between;gap:10px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:99px;background:#bfe6ff1c;border:1px solid #bfe6ff44;color:#d6eeff;font-size:13px;font-weight:600}
.chip svg{width:14px;height:14px}
@media (prefers-reduced-motion:no-preference){
.bar i{transition:width .6s cubic-bezier(.2,.9,.3,1)}
.panel.on{animation:pin .4s cubic-bezier(.2,.9,.3,1) both}
@keyframes pin{from{opacity:0;transform:translateY(14px)}}
.op.new{animation:slide .55s cubic-bezier(.2,.9,.3,1) both}
@keyframes slide{from{opacity:0;transform:translateX(-28px) scale(.95)}}
.rip{animation:rip .65s ease-out forwards}
@keyframes rip{from{transform:scale(0)}to{transform:scale(3.5);opacity:0}}
.aur{animation:drift 18s ease-in-out infinite alternate}
.stars{animation:tw 5s ease-in-out infinite alternate}
@keyframes tw{to{opacity:calc(var(--stars)*.55)}}
@keyframes drift{to{transform:translate(7%,-5%) scale(1.18)}}
.hero{animation:pin .7s cubic-bezier(.2,.9,.3,1) both}
}
</style>
</head>
<body>
<div id="scene" aria-hidden="true"><div class="aur"></div><div class="stars"></div><div class="moon"></div>
<svg class="hills" viewBox="0 0 800 320" preserveAspectRatio="xMidYMax slice"><defs><symbol id="fir" viewBox="0 0 40 80"><path d="M20 0L34 30H26L38 55H27L40 80H0L13 55H2L14 30H6Z"/></symbol></defs>
<path class="f1" d="M0 190Q120 120 260 170T520 150T800 140V320H0Z"/>
<path class="f2" d="M0 235Q180 165 380 225T800 190V320H0Z"/>
<g class="tm"><use href="#fir" x="40" y="170" width="26" height="52"/><use href="#fir" x="90" y="151" width="32" height="64"/><use href="#fir" x="132" y="178" width="22" height="44"/><use href="#fir" x="330" y="186" width="20" height="40"/><use href="#fir" x="560" y="145" width="30" height="60"/><use href="#fir" x="612" y="157" width="24" height="48"/><use href="#fir" x="682" y="130" width="35" height="70"/><use href="#fir" x="735" y="148" width="26" height="52"/><use href="#fir" x="770" y="138" width="30" height="60"/></g>
<path class="f3" d="M0 285Q200 245 420 275T800 262V320H0Z"/>
<g class="tf"><use href="#fir" x="14" y="182" width="55" height="110"/><use href="#fir" x="70" y="207" width="40" height="80"/><use href="#fir" x="700" y="175" width="50" height="100"/><use href="#fir" x="748" y="140" width="66" height="132"/></g></svg></div>
<canvas id="snow" aria-hidden="true"></canvas>
<div id="bolt" aria-hidden="true"></div>
<main>
  <section class="hero">
    <div class="hh"><small>Мой баланс</small><span class="hb"><button class="chip" id="bgbtn" type="button" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M3 16l5-5 4 4 3-3 6 6"/></svg>Фон</button><button class="chip" id="wxbtn" type="button" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 18a4 4 0 010-8 5 5 0 019.6-1A4.5 4.5 0 0117 18z"/></svg>Погода</button></span></div>
    <div class="bgs" id="bgs" hidden></div>
    <div class="bgs" id="wxs" hidden></div>
    <div class="bal" id="bal">0 ₽</div>
    <div class="split"><div class="i"><small>Доходы</small><b id="ti">0 ₽</b></div><div class="o"><small>Расходы</small><b id="to">0 ₽</b></div></div>
  </section>

  <section class="panel on" id="p-hist">
    <h2>История</h2>
    <div id="hist"></div>
  </section>

  <section class="panel" id="p-in">
    <h2>Добавить доход</h2>
    <form data-k="in">
      <input type="number" inputmode="decimal" min="0" step="0.01" placeholder="Сумма" required><select class="cur" aria-label="Валюта"><option value="RUB">₽</option><option value="USD">$</option><option value="EUR">€</option></select>
      <select></select><input type="text" placeholder="Заметка">
      <div class="w conv"></div><button class="btn in w" type="submit">Записать доход</button>
    </form>
    <div class="total" id="tin"></div>
    <div id="l-in"></div>
  </section>

  <section class="panel" id="p-out">
    <h2>Добавить расход</h2>
    <form data-k="out">
      <input type="number" inputmode="decimal" min="0" step="0.01" placeholder="Сумма" required><select class="cur" aria-label="Валюта"><option value="RUB">₽</option><option value="USD">$</option><option value="EUR">€</option></select>
      <select></select><input type="text" placeholder="На что потратил">
      <div class="w conv"></div><button class="btn out w" type="submit">Записать расход</button>
    </form>
    <div class="total" id="tout"></div>
    <div id="l-out"></div>
  </section>

  <section class="panel" id="p-plan">
    <h2>План трат</h2>
    <div class="card">
      <small style="color:var(--mute)">Сколько денег распределяю</small>
      <div class="row" style="margin-top:6px">
        <input id="bud" type="number" inputmode="decimal" min="0" step="0.01" placeholder="Сумма">
        <button class="btn gold" id="useBal" type="button" style="width:auto">Мой баланс</button>
      </div>
      <div class="bar" id="pbar"></div>
      <small style="color:var(--mute)" id="lt">Останется</small>
      <div class="left" id="left">0 ₽</div>
    </div>
    <form id="pf">
      <input type="text" placeholder="Например: телефон" required>
      <input type="number" inputmode="decimal" min="0" step="0.01" placeholder="Сумма" required>
      <button class="btn gold w" type="submit">Добавить в план</button>
    </form>
    <div id="pl"></div>
  </section>
  <section class="panel" id="p-acc">
    <h2>Мои деньги</h2>
    <div class="card">
      <small style="color:var(--mute)">Всего у меня</small>
      <div class="left" id="atot">0 ₽</div>
      <div class="bar" id="abar"></div>
    </div>
    <div class="card"><small style="color:var(--mute)">Курс к рублю (ЦБ на 20 ноября, меняется вручную)</small>
      <div class="row" style="margin:8px 0 0"><label class="rt">$ <input id="rusd" type="number" inputmode="decimal" min="0" step="0.01" aria-label="Курс доллара"></label><label class="rt">€ <input id="reur" type="number" inputmode="decimal" min="0" step="0.01" aria-label="Курс евро"></label></div></div>
    <form id="af">
      <input class="w" list="aplaces" type="text" placeholder="Где лежат: карта, наличные…" required>
      <input type="number" inputmode="decimal" min="0" step="0.01" placeholder="Сумма" required><select class="cur" aria-label="Валюта"><option value="RUB">₽</option><option value="USD">$</option><option value="EUR">€</option></select>
      <div class="w conv"></div><button class="btn in w" type="submit">Добавить</button>
    </form>
    <datalist id="aplaces"><option value="Наличные"><option value="Карта"><option value="Вклад"><option value="Накопительный счёт"><option value="Криптовалюта"><option value="Копилка"></datalist>
    <div id="al"></div>
  </section>
</main>
<nav id="nav">
  <button data-t="hist" class="on">История</button>
  <button data-t="in">Доходы</button>
  <button data-t="out">Расходы</button>
  <button data-t="plan">План</button>
  <button data-t="acc">Счета</button>
</nav>
<script>
var CATS={in:["Зарплата","Подработка","Подарок","Другое"],out:["Еда","Транспорт","Жильё","Связь","Развлечения","Покупки","Здоровье","Другое"]};
var COL=["#ffd166","#9b8cff","#6cc3ff","#6ee7c8","#ff7a9a","#ffa75c","#c6ff7a"];
var $=function(s,r){return (r||document).querySelector(s)};
var db={ops:[],plan:[],budget:null};
try{var r=JSON.parse(localStorage.getItem("kopilka")||"null");if(r)db=r}catch(e){}
db.accts=db.accts||[];db.rates=db.rates||{USD:81.93,EUR:89.86};
var SYM={RUB:"₽",USD:"$",EUR:"€"};
function toRub(a,c){var r=c==="USD"?db.rates.USD:c==="EUR"?db.rates.EUR:1;return Math.round(a*r*100)/100}
function save(){try{localStorage.setItem("kopilka",JSON.stringify(db))}catch(e){}}
var nf=new Intl.NumberFormat("ru-RU",{maximumFractionDigits:2});
function m(n){return nf.format(n)+" ₽"}
function sum(k){return db.ops.filter(function(o){return o.k===k}).reduce(function(s,o){return s+o.a},0)}
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function dayLabel(ts){var d=new Date(ts),n=new Date();d.setHours(0,0,0,0);n.setHours(0,0,0,0);
  var diff=Math.round((n-d)/864e5);if(diff===0)return"Сегодня";if(diff===1)return"Вчера";
  return d.toLocaleDateString("ru-RU",{day:"numeric",month:"long"})}
function opRow(o){
  var r=el("div","op "+o.k),ic=el("div","ic",o.c.charAt(0));
  var t=el("div","t");t.appendChild(el("b",0,o.c));
  t.appendChild(el("span",0,new Date(o.d).toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit"})+(o.u?" · "+nf.format(o.u.a)+" "+SYM[o.u.c]:"")+(o.n?" · "+o.n:"")));
  var a=el("div","a",(o.k==="in"?"+":"−")+m(o.a));
  if(o.id===newId)r.classList.add("new");
  r.append(ic,t,a);return r}
function list(box,ops,msg){
  box.innerHTML="";
  if(!ops.length){box.appendChild(el("div","empty",msg));return}
  var last="";
  ops.forEach(function(o){var l=dayLabel(o.d);if(l!==last){box.appendChild(el("div","day",l));last=l}box.appendChild(opRow(o))})}
function render(){
  var ti=sum("in"),to=sum("out"),bal=ti-to;
  var b=$("#bal");countTo(b,bal);b.classList.toggle("neg",bal<0);
  countTo($("#ti"),ti);countTo($("#to"),to);
